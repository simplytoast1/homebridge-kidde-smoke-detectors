name: CI

on:
  pull_request:
  push:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        # Every Node.js LTS line Homebridge supports, as the verified-plugin rules require
        node-version: [22, 24, 26]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    name: Publish to npm
    needs: build
    if: github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
      - run: npm ci
      - run: npm run build
      # A version already on npm (published by hand, or a re-run release) is
      # skipped, so a release never fails for having been published already
      - name: Publish unless this version is already on npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm; nothing to publish."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
